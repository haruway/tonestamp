<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tonestamp — meio-tom tonal em 7 estados</title>
<meta name="description" content="Meio-tom por mapeamento tonal em 7 estados. Roda offline no navegador, sem instalação.">
<meta name="color-scheme" content="dark light">

<link rel="stylesheet" href="styles/fonts.css">
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/components.css">

<!--
  Boot do tema antes da primeira pintura, pra não piscar o tema errado.
  Precisa ser inline e síncrono: um módulo externo carregaria tarde demais.
-->
<script>
(function(){
  try{
    var saved = localStorage.getItem('tonestamp:theme');
    if(saved !== 'light' && saved !== 'dark'){
      saved = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    }
    document.documentElement.setAttribute('data-theme', saved);
    var lang = localStorage.getItem('tonestamp:lang');
    if(lang !== 'pt' && lang !== 'en'){
      lang = (navigator.language || 'en').toLowerCase().indexOf('pt') === 0 ? 'pt' : 'en';
    }
    document.documentElement.lang = lang === 'pt' ? 'pt-BR' : 'en';
  }catch(e){ /* localStorage bloqueado: fica no dark do atributo */ }
})();
</script>
</head>
<body>

<main id="stage">
  <div id="stageTag">TONESTAMP <b id="tagInfo" data-i18n="tag.none"></b></div>

  <canvas id="out" width="900" height="900" role="img" data-i18n-aria="canvas.aria"></canvas>

  <div id="hint">
    <span data-i18n="hint.drop"></span>
    <span id="fps" role="status" aria-live="off"></span>
    <span id="perfWarn" class="warn" data-i18n="hint.perf" hidden></span>
  </div>

  <div id="drop" aria-hidden="true" data-i18n="drop.label"></div>
</main>

<aside id="panel" data-i18n-aria="panel.aria">

  <div class="head">
    <div class="head-top">
      <div>
        <h1>Tone<span>stamp</span></h1>
        <p data-i18n="head.sub"></p>
      </div>
      <div class="head-actions">
        <button id="langToggle" class="icon-btn icon-btn-text" type="button">EN</button>
        <button id="themeToggle" class="icon-btn" type="button" title="">
          <span class="icon-btn-glyph" aria-hidden="true"></span>
        </button>
      </div>
    </div>
  </div>

  <section class="sec" aria-labelledby="h-fonte">
    <h2 id="h-fonte" data-i18n="sec.source"></h2>
    <div class="row3" style="margin-bottom:10px">
      <button id="bImg" type="button" data-i18n="btn.image"></button>
      <button id="bVid" type="button" data-i18n="btn.video"></button>
      <button id="bCam" type="button" data-i18n="btn.cam"></button>
    </div>
    <input type="file" id="fImg" accept="image/*" class="vh" tabindex="-1" aria-hidden="true">
    <input type="file" id="fVid" accept="video/*" class="vh" tabindex="-1" aria-hidden="true">
    <div class="row">
      <button id="bRatio" type="button" aria-pressed="false"></button>
      <button id="bPlay" type="button"></button>
    </div>
    <p class="note srcmsg" id="srcMsg" role="status" hidden></p>
  </section>

  <section class="sec" aria-labelledby="h-grid">
    <h2 id="h-grid" data-i18n="sec.grid"></h2>
    <label class="f" for="rCols">
      <span class="lb"><span data-i18n="lbl.cols"></span> <b id="vCols">80</b></span>
      <input type="range" id="rCols" min="8" max="220" value="80">
    </label>
    <label class="f" for="cBg">
      <span class="lb" data-i18n="lbl.bg"></span>
      <input type="color" id="cBg" value="#000000">
    </label>
    <label class="chk"><input type="checkbox" id="kFill" checked><span data-i18n="chk.fill"></span></label>
    <label class="chk"><input type="checkbox" id="kInv"><span data-i18n="chk.invert"></span></label>
  </section>

  <section class="sec" aria-labelledby="h-states">
    <h2 id="h-states" data-i18n="sec.states"></h2>
    <div id="states"></div>
    <div class="row" style="margin-top:10px">
      <button id="bAllWhite" type="button" data-i18n="btn.allWhite"></button>
      <button id="bReset" type="button" data-i18n="btn.defaultShapes"></button>
    </div>
  </section>

  <section class="sec" aria-labelledby="h-cor">
    <h2 id="h-cor" data-i18n="sec.color"></h2>
    <div class="seg" role="group" data-i18n-aria="sec.color" style="margin-bottom:12px">
      <button id="mState" type="button" class="on" aria-pressed="true" data-i18n="mode.state"></button>
      <button id="mPixel" type="button" aria-pressed="false" data-i18n="mode.pixel"></button>
      <button id="mQuant" type="button" aria-pressed="false" data-i18n="mode.quant"></button>
    </div>
    <p class="note" id="modeNote" role="status" style="margin-bottom:14px"></p>
    <label class="f" for="rPal">
      <span class="lb"><span data-i18n="lbl.palN"></span> <b id="vPal">5</b></span>
      <input type="range" id="rPal" min="2" max="8" value="5">
    </label>
    <div id="swatches"><span id="swEmpty" data-i18n="sw.empty"></span></div>
    <div class="row" style="margin-bottom:8px">
      <button id="bExtract" type="button" data-i18n="btn.extract"></button>
      <button id="bApply" type="button" data-i18n="btn.apply"></button>
    </div>
    <label class="chk"><input type="checkbox" id="kAuto" checked><span data-i18n="chk.autoPal"></span></label>
    <label class="f" for="rSat" style="margin-top:14px">
      <span class="lb"><span data-i18n="lbl.sat"></span> <b id="vSat">0</b></span>
      <input type="range" id="rSat" min="-100" max="100" value="0">
    </label>
  </section>

  <section class="sec" aria-labelledby="h-escala">
    <h2 id="h-escala" data-i18n="sec.scale"></h2>
    <label class="chk"><input type="checkbox" id="kScale"><span data-i18n="chk.scale"></span></label>
    <label class="f" for="rMin">
      <span class="lb"><span data-i18n="lbl.min"></span> <b id="vMin">30</b></span>
      <input type="range" id="rMin" min="0" max="100" value="30">
    </label>
    <label class="f" for="rMax">
      <span class="lb"><span data-i18n="lbl.max"></span> <b id="vMax">100</b></span>
      <input type="range" id="rMax" min="0" max="140" value="100">
    </label>
    <label class="chk"><input type="checkbox" id="kRot"><span data-i18n="chk.rot"></span></label>
    <label class="f" for="rRot">
      <span class="lb"><span data-i18n="lbl.rotInt"></span> <b id="vRot">400ms</b></span>
      <input type="range" id="rRot" min="40" max="2000" step="20" value="400">
    </label>
    <p class="note" data-i18n="note.rot"></p>
  </section>

  <section class="sec" aria-labelledby="h-tom">
    <h2 id="h-tom" data-i18n="sec.tone"></h2>
    <label class="f" for="rBri">
      <span class="lb"><span data-i18n="lbl.bri"></span> <b id="vBri">0</b></span>
      <input type="range" id="rBri" min="-100" max="100" value="0">
    </label>
    <label class="f" for="rCon">
      <span class="lb"><span data-i18n="lbl.con"></span> <b id="vCon">0</b></span>
      <input type="range" id="rCon" min="-100" max="100" value="0">
    </label>
    <label class="f" for="rGam">
      <span class="lb"><span data-i18n="lbl.gam"></span> <b id="vGam">1.00</b></span>
      <input type="range" id="rGam" min="30" max="300" value="100">
    </label>
  </section>

  <section class="sec" aria-labelledby="h-export">
    <h2 id="h-export" data-i18n="sec.export"></h2>
    <label class="f" for="rRes">
      <span class="lb"><span data-i18n="lbl.res"></span> <b id="vRes">1440px</b></span>
      <input type="range" id="rRes" min="600" max="3000" step="60" value="1440">
    </label>
    <label class="chk" style="margin-bottom:12px"><input type="checkbox" id="kAlpha"><span data-i18n="chk.alpha"></span></label>
    <div class="row" style="margin-bottom:8px">
      <button class="pri" id="bPng" type="button">PNG</button>
      <button id="bSvg" type="button">SVG</button>
    </div>
    <button class="rec" id="bRec" type="button" aria-pressed="false"></button>
    <p class="note" style="margin-top:12px" data-i18n="note.export"></p>
  </section>

  <section class="sec" aria-labelledby="h-presets">
    <h2 id="h-presets" data-i18n="sec.presets"></h2>
    <div class="row">
      <button id="bSavePreset" type="button" data-i18n="btn.savePreset"></button>
      <button id="bLoadPreset" type="button" data-i18n="btn.loadPreset"></button>
    </div>
    <input type="file" id="fPreset" accept="application/json,.json" class="vh" tabindex="-1" aria-hidden="true">
    <p class="note msg" id="presetMsg" role="status" hidden></p>
    <p class="note" style="margin-top:12px" data-i18n="note.presets"></p>
  </section>

  <section class="sec" style="border-bottom:none">
    <p class="note" data-i18n="note.flow"></p>
  </section>

</aside>

<script type="module" src="js/main.js"></script>
</body>
</html>
